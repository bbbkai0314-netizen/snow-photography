backend:
  name: github
  repo: bbbkai0314-netizen/snow-photography
  branch: main
  base_url: "https://snowsurf-cms-auth.bbbkai0314.workers.dev"
  auth_endpoint: auth

media_folder: "src/images"
public_folder: "images"

site_url: "https://bbbkai0314-netizen.github.io/snow-photography/"
display_url: "https://bbbkai0314-netizen.github.io/snow-photography/"
logo_url: "https://bbbkai0314-netizen.github.io/snow-photography/images/action-01.jpg"

locale: "zh_Hant"

collections:
  - name: "posts"
    label: "部落格文章"
    label_singular: "文章"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { name: "layout", widget: "hidden", default: "article" }
      - { name: "tags", widget: "hidden", default: "posts" }
      - { name: "title", label: "標題", widget: "string" }
      - { name: "tag", label: "分類標籤", widget: "string", hint: "例如：教學、比較、雪場攻略" }
      - { name: "metaLine", label: "副標說明", widget: "string" }
      - { name: "heroImage", label: "主圖（文章頁大圖）", widget: "image", media_library: { config: { multiple: false } } }
      - { name: "heroImageAlt", label: "主圖替代文字（無障礙用）", widget: "string" }
      - { name: "previewImage", label: "首頁卡片縮圖（留空使用主圖）", widget: "image", required: false }
      - { name: "previewImageAlt", label: "首頁卡片縮圖替代文字（留空使用主圖替代文字）", widget: "string", required: false }
      - { name: "leadParagraph", label: "開場段落", widget: "text" }
      - { name: "date", label: "發布日期", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "dateModified", label: "更新日期", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: "previewDescription", label: "首頁卡片一句話簡介", widget: "string" }
      - name: "seo"
        label: "SEO 設定"
        widget: "object"
        collapsed: true
        fields:
          - { name: "title", label: "SEO 標題（留空自動帶入標題）", widget: "string", required: false }
          - { name: "description", label: "SEO 描述", widget: "text" }
          - { name: "keywords", label: "SEO 關鍵字（逗號分隔）", widget: "string" }
          - { name: "ogImage", label: "社群分享圖（留空使用主圖）", widget: "image", required: false }
      - { name: "body", label: "文章內容", widget: "markdown" }

  - name: "plans"
    label: "拍攝方案"
    label_singular: "方案"
    folder: "src/plans"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { name: "layout", widget: "hidden", default: "plan" }
      - { name: "tags", widget: "hidden", default: "plans" }
      - { name: "title", label: "方案名稱", widget: "string" }
      - { name: "subtitleEn", label: "英文副標", widget: "string" }
      - { name: "eyebrowNumber", label: "編號", widget: "string", hint: "例如：01" }
      - { name: "eyebrowLabel", label: "編號旁標籤（留空使用方案名稱）", widget: "string", required: false }
      - { name: "serviceType", label: "服務類型（SEO 結構化資料用）", widget: "string" }
      - { name: "heroImage", label: "主圖", widget: "image", media_library: { config: { multiple: false } } }
      - { name: "heroImageAlt", label: "主圖替代文字（無障礙用）", widget: "string" }
      - { name: "leadParagraph", label: "開場段落", widget: "text" }
      - { name: "previewDescription", label: "首頁卡片一句話簡介", widget: "string" }
      - { name: "order", label: "首頁排序（數字愈小愈前面）", widget: "number", value_type: "int" }
      - { name: "ctaText", label: "結尾行動呼籲文字", widget: "text" }
      - name: "sections"
        label: "內容區塊（例如：適合對象、內容包含）"
        widget: "list"
        fields:
          - { name: "heading", label: "標題", widget: "string" }
          - { name: "items", label: "項目清單", widget: "list", field: { name: "item", widget: "string" } }
      - { name: "groupsHeading", label: "分組區塊標題（選填，例如：方案內容）", widget: "string", required: false }
      - name: "groups"
        label: "分組項目（選填，例如尊榮服務方案的多個服務分類）"
        widget: "list"
        required: false
        fields:
          - { name: "icon", label: "圖示 Emoji", widget: "string" }
          - { name: "title", label: "分組標題", widget: "string" }
          - { name: "items", label: "項目清單", widget: "list", field: { name: "item", widget: "string" } }
      - name: "seo"
        label: "SEO 設定"
        widget: "object"
        collapsed: true
        fields:
          - { name: "title", label: "SEO 標題（留空自動帶入標題）", widget: "string", required: false }
          - { name: "description", label: "SEO 描述", widget: "text" }
          - { name: "keywords", label: "SEO 關鍵字（逗號分隔）", widget: "string" }
          - { name: "ogImage", label: "社群分享圖（留空使用主圖）", widget: "image", required: false }

  - name: "site"
    label: "首頁文字內容"
    files:
      - name: "homepage"
        label: "首頁設定"
        file: "src/_data/site.json"
        fields:
          - { name: "heroLocationLine", label: "首頁大標下方地點副標", widget: "string" }
          - { name: "aboutLead", label: "關於區塊一句話定位", widget: "text" }
          - name: "newsBanner"
            label: "最新消息 Banner"
            widget: "object"
            fields:
              - { name: "active", label: "顯示這則消息", widget: "boolean", default: true }
              - { name: "title", label: "標題", widget: "string" }
              - { name: "copy", label: "說明文字", widget: "text" }
              - { name: "buttonLabel", label: "按鈕文字", widget: "string" }
          - name: "seo"
            label: "首頁 SEO 設定"
            widget: "object"
            collapsed: true
            fields:
              - { name: "title", label: "SEO 標題", widget: "string" }
              - { name: "description", label: "SEO 描述", widget: "text" }
              - { name: "keywords", label: "SEO 關鍵字（逗號分隔）", widget: "string" }
              - { name: "ogImage", label: "社群分享圖", widget: "image" }
